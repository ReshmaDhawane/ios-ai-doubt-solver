name: AIDoubtSolver
options:
  bundleIdPrefix: com.reshma
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  AIDoubtSolver:
    type: application
    platform: iOS
    sources:
      - path: AIDoubtSolver
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reshma.aidoubtsolver
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AI Doubt Solver
        INFOPLIST_FILE: AIDoubtSolver/Info.plist
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
  AIDoubtSolverTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AIDoubtSolverTests]
    dependencies:
      - target: AIDoubtSolver
schemes:
  AIDoubtSolver:
    build:
      targets:
        AIDoubtSolver: all
        AIDoubtSolverTests: [test]
    test:
      targets: [AIDoubtSolverTests]
